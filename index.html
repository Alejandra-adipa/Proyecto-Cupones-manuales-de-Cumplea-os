<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Solicitud Cupón de Cumpleaños · Adipa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand: #704EFD;
      --brand-dark: #5338d4;
      --brand-light: #ede9ff;
      --success: #12B76A;
      --success-bg: #ecfdf5;
      --danger: #F04438;
      --danger-bg: #fef3f2;
      --warn: #F79009;
      --warn-bg: #fffaeb;
      --text: #101828;
      --muted: #475467;
      --border: #D0D5DD;
      --surface: #F9FAFB;
      --white: #ffffff;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #F2F0FB;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 80px;
      letter-spacing: 0.01em;
    }

    body::before {
      content: '';
      position: fixed;
      top: -120px; right: -120px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(112,78,253,0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .logo-wrap { margin-bottom: 32px; position: relative; z-index: 1; }
    .logo-wrap img { height: 40px; }

    .card {
      background: var(--white);
      border-radius: 20px;
      box-shadow: 0 4px 40px rgba(16,24,40,0.08), 0 1px 4px rgba(16,24,40,0.04);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
      position: relative; z-index: 1;
    }

    .card-header {
      background: linear-gradient(135deg, var(--brand) 0%, #9b7aff 100%);
      padding: 32px 36px;
      position: relative;
      overflow: hidden;
    }
    .card-header::after {
      content: '🎂';
      position: absolute;
      right: 28px; top: 50%;
      transform: translateY(-50%);
      font-size: 56px;
      opacity: 0.25;
      filter: grayscale(1);
    }
    .card-header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: white;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .card-header p {
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      margin-top: 8px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: 0.02em;
    }

    .card-body { padding: 32px 36px; }

    .steps {
      display: flex;
      gap: 0;
      margin-bottom: 32px;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 4px;
    }
